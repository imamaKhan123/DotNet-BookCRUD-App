<div *ngIf="paginatedQuotes().length > 0" class="container mt-4">
  <h2>Quotes</h2>
  <button class="btn btn-sm btn-primary me-2 my-2 responsive-button" (click)="addNewQuote()">
    <i class="fa fa-quote-right-alt"></i> Add New Quote
  </button>

  <table class="table table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th><i class="fa fa-quote-left"></i> Quote</th>
        <th><i class="fa fa-user"></i> Author</th>
        <th><i class="fa fa-gears"></i> Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let quote of paginatedQuotes(); let i = index">
        <td>{{ i+1 }}</td>
        <td>{{ quote.text }}</td>
        <td>{{ quote.author }}</td>
        <td>
          <button class="btn btn-sm btn-outline-warning me-2 my-2 responsive-button btn-small" (click)="editQuote(quote)">
            <i class="fa fa-edit"></i>Edit
          </button>
          <button class="btn btn-sm btn-outline-danger me-2 my-2 responsive-button btn-small"
                  (click)="deleteQuote(quotes[(currentPageQuotes - 1) * pageSizeQuotes + i].id)">
            <i class="fa fa-trash-alt"></i> Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <button class="btn btn-outline-primary responsive-button" (click)="prevQuotePage()" [disabled]="currentPageQuotes === 1">
      Previous
    </button>
    <span>Page {{ currentPageQuotes }}</span>
    <button class="btn btn-outline-primary responsive-button" (click)="nextQuotePage()"
            [disabled]="currentPageQuotes * pageSizeQuotes >= quotes.length">
      Next
    </button>
  </div>
</div>

<div *ngIf="quotes.length === 0" class="alert alert-info mt-4">
  No quotes added yet.
</div>
